# Config for Raspberry Pi 5 used as an SWD adapter, with the SWD signals
# generated by a PIO state machine in RP1 (requires piolib and /dev/pio0).
# https://www.raspberrypi.com/documentation/computers/raspberry-pi.html
#
# Uses the same header pins as raspberrypi5-gpiod.cfg, so the two are
# interchangeable. SRST (optional) is driven through libgpiod.

adapter driver rp1pio

proc read_file { name } {
	if {[catch {open $name r} fd]} {
		return ""
	}
	set result [read $fd]
	close $fd
	return $result
}

proc find_rp1_alias {} {
	foreach f [glob -directory "/proc/device-tree/aliases" "gpio\[0-9\]"] {
		if {[string match "*/rp1/*" [read_file $f]]} {
			return $f
		}
	}
}

set GPIO_CHIP [string index [find_rp1_alias] end]
source [find interface/raspberrypi-gpio-connector.cfg]

transport select swd
